<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 工作台 - 设置</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; --bg: #f4efe6; --card: #fffdf8; --fg: #201b15; --muted: #8c8477; --line: rgba(70,50,25,.14); --accent: #e8692e; --accent2: #c24f1c; --err: #c2412f; --soft: rgba(232,105,46,.11); }
  @media (prefers-color-scheme: dark) { :root { --bg: #13100c; --card: #1d1914; --fg: #f3ece0; --muted: #968c7d; --line: rgba(255,230,195,.12); --accent: #ff8a4c; --accent2: #ffab78; --err: #f2907f; --soft: rgba(255,138,76,.13); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); overflow: hidden;
         font: 15px/1.6 "Figtree", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; padding: 16px; }
  body::before { content: ""; position: fixed; width: 60vw; height: 60vw; right: -15vw; top: -20vw; border-radius: 50%; background: #ffb37a; filter: blur(100px); opacity: .4; animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-8vw, 6vw) scale(1.1); } }
  .card { position: relative; width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px; box-shadow: 0 30px 80px -24px rgba(50,30,10,.35); animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .orb { width: 44px; height: 44px; border-radius: 50%; margin-bottom: 14px; background: radial-gradient(circle at 34% 28%, #fff7dc 0 7%, #ffc56c 20%, #f37b2f 55%, #b5401b 100%); box-shadow: 0 0 26px rgba(243,123,47,.5); animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.07); } }
  h1 { font: italic 400 34px/1.1 "Instrument Serif", serif; margin: 0 0 6px; }
  p.sub { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: transparent; color: inherit; font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--soft); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; margin-top: 20px; cursor: pointer; }
  .check input { margin-top: 5px; accent-color: var(--accent); }
  #serverBox { display: none; border-left: 3px solid var(--soft); padding-left: 12px; }
  button { margin-top: 24px; width: 100%; padding: 11px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 10px 24px -10px var(--accent); transition: transform .2s; }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .6; cursor: default; transform: none; }
  #status { min-height: 1.6em; margin-top: 12px; font-size: 13px; }
  #status.err { color: var(--err); }
  .found { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .found button { margin: 0; text-align: left; background: transparent; color: inherit; border: 1px solid var(--line); font-weight: 500; display: flex; justify-content: space-between; box-shadow: none; border-radius: 11px; animation: rise .4s both; }
  .found button:hover, .found button.on { border-color: var(--accent); background: var(--soft); transform: none; }
  .found .u { color: var(--muted); font-size: 13px; font-weight: 400; }
  .row { display: flex; align-items: center; gap: 8px; margin: 16px 0 6px; }
  .row label { margin: 0; flex: 1; }
  .link { background: none; border: 0; color: var(--accent); width: auto; margin: 0; padding: 0; font-weight: 500; font-size: 13px; box-shadow: none; }
  .link:hover { transform: none; text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="orb"></div>
  <h1>连接 Projector</h1>
  <p class="sub">选择局域网里的台式机，之后打开软件会直接进入登录页。以后可以在托盘图标的菜单里修改。</p>

  <div class="row"><label>局域网里的服务器</label><button class="link" id="scan">重新查找</button></div>
  <div class="found" id="found"><div class="hint">正在查找…</div></div>

  <label for="url">服务器地址</label>
  <input id="url" type="text" value="http://localhost:8080" spellcheck="false">
  <div class="hint">上面找到了就点一下，会自动填好。找不到时手动填：http://台式机名:8080（Mac 上写成 台式机名.local），或者 http://台式机IP:8080</div>

  <label class="check"><input id="mode" type="checkbox"><span>服务端模式（只在台式机上勾选）<br>
    <span class="hint" style="font-weight:400">开机自动在后台启动中心服务，崩溃后自动重启</span></span></label>
  <div id="serverBox">
    <label for="dir">项目文件夹</label>
    <input id="dir" type="text" placeholder="例如 D:\Projector" spellcheck="false">
    <div class="hint">server.py 和 config.bat 所在的文件夹</div>
  </div>

  <button id="save">保存并连接</button>
  <div id="status"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const invoke = window.__TAURI__ && window.__TAURI__.core.invoke;

let cfgUrl = "";
function setStatus(text, err) { $("status").textContent = text; $("status").className = err ? "err" : ""; }
$("mode").onchange = () => { $("serverBox").style.display = $("mode").checked ? "block" : "none"; };

async function load() {
  if (!invoke) return setStatus("这个页面需要在 Claude 工作台桌面软件里打开", true);
  const cfg = await invoke("get_config");
  cfgUrl = cfg.server_url;
  if (cfg.server_url) $("url").value = cfg.server_url;
  scan();
  $("mode").checked = cfg.server_mode;
  $("dir").value = cfg.project_dir;
  $("mode").onchange();
}

$("save").onclick = async () => {
  $("save").disabled = true;
  setStatus("正在连接…");
  try {
    await invoke("save_config", { serverUrl: $("url").value.trim(), serverMode: $("mode").checked, projectDir: $("dir").value.trim() });
    setStatus($("mode").checked ? "已保存，正在启动中心服务…" : "已保存，正在打开…");
  } catch (e) {
    setStatus(String(e), true);
    $("save").disabled = false;
  }
};
async function scan() {
  $("found").innerHTML = '<div class="hint">正在查找…</div>';
  try {
    const list = await invoke("discover_servers");
    if (!list.length) {
      $("found").innerHTML = '<div class="hint">没找到。确认台式机上的服务已经启动、两台电脑连的是同一个网络；或者在下面手动填地址。</div>';
      return;
    }
    $("found").innerHTML = "";
    for (const s of list) {
      const b = document.createElement("button");
      b.innerHTML = `<span>🖥 ${s.name}</span><span class="u">${s.url}</span>`;
      b.onclick = () => {
        $("url").value = s.url;
        $("found").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      };
      $("found").appendChild(b);
    }
    if (list.length === 1 && !cfgUrl) $("found").querySelector("button").click();
  } catch (e) { $("found").innerHTML = `<div class="hint">查找失败：${e}</div>`; }
}
$("scan").onclick = scan;
$("url").onkeydown = $("dir").onkeydown = e => { if (e.key === "Enter") $("save").click(); };
load();
</script>
</body>
</html>
