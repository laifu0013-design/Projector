<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --side: #efeee9; --text: #1f1f1d; --muted: #77756e;
  --border: #e2e0d8; --accent: #c96442; --accent-text: #fff; --user: #ebe8df; --error: #b3261e;
  --chip: #f1efe8; --code: #f3f2ee; --warn-bg: #fdf3e1; --warn: #9a5b00; --ok: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1d1b; --panel: #262624; --side: #222220; --text: #ecebe6; --muted: #9a988f;
    --border: #3a3936; --accent: #d97757; --user: #34332f; --error: #f2b8b5; --chip: #31302d; --code: #2f2e2b;
    --warn-bg: #3a2f1c; --warn: #f0c27a; --ok: #8bc78e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: flex; height: 100%; }

aside { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side-head { padding: 14px; display: flex; gap: 8px; align-items: center; }
.side-head h1 { font-size: 16px; margin: 0; flex: 1; }
.side-foot { padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
.side-foot a { color: inherit; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.small { padding: 2px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
#sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sess { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.sess:hover { background: var(--border); }
.sess.active { background: var(--panel); box-shadow: 0 0 0 1px var(--border); }
.sess .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; flex-shrink: 0; }
.sess .warn { font-size: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 5px; }
.sess .x { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 0 4px; }
.sess:hover .x { visibility: visible; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top .title { flex: 1; min-width: 120px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
.toggle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.toggle.on { color: var(--error); font-weight: 600; }
#menuBtn { display: none; }
#conn { font-size: 12px; color: var(--muted); }
#messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
.inner { max-width: 820px; margin: 0 auto; }
.msg { margin: 0 0 18px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .body { background: var(--user); padding: 8px 14px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; }
.msg.error .body { color: var(--error); white-space: pre-wrap; }
.msg.event { text-align: center; font-size: 13px; color: var(--muted); }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg table { border-collapse: collapse; } .msg td, .msg th { border: 1px solid var(--border); padding: 4px 8px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { font-size: 12px; background: var(--chip); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
.typing::after { content: "▍"; animation: pulse .6s infinite alternate; }

.approval { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; margin: 0 0 18px; }
.approval strong { color: var(--warn); }
.approval pre { background: var(--panel); border-radius: 6px; padding: 8px; max-height: 260px; overflow: auto; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
.approval .acts { display: flex; gap: 8px; justify-content: flex-end; }
.del { color: var(--error); } .add { color: var(--ok); }

.composer { border-top: 1px solid var(--border); padding: 12px 16px; }
.composer .inner { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; min-height: 52px; max-height: 240px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.composer .btns { display: flex; flex-direction: column; gap: 6px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay.show { display: flex; }
.dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 860px; max-height: 90vh; display: flex; flex-direction: column; }
.dialog header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.dialog header strong { flex: 1; }
#steps { overflow-y: auto; padding: 12px 16px; font-size: 13px; }
.step { margin-bottom: 10px; }
.step .k { font-size: 12px; color: var(--muted); }
.step pre { background: var(--code); border-radius: 6px; padding: 8px; margin: 2px 0 0; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
.step.thinking pre { font-style: italic; color: var(--muted); }
.step.err pre { color: var(--error); }

#login { background: var(--bg); }
#login form { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 12px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
#login input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }

@media (max-width: 720px) {
  aside { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; }
  aside.open { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  #menuBtn { display: inline-block; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="side-head"><h1>Claude 工作台</h1><button class="btn primary" id="newBtn">新会话</button></div>
    <div id="sessions"></div>
    <div class="side-foot">当前用户：<span id="me"></span> · <a href="#" id="switchUser">切换</a></div>
  </aside>
  <main>
    <div class="top">
      <button class="btn" id="menuBtn">☰</button>
      <div class="title" id="title" title="双击重命名">新会话</div>
      <label class="toggle" id="bypassWrap" title="打开后本会话的所有操作（包括删除、运行命令）都不再询问">
        <input type="checkbox" id="bypass"> 完全放行
      </label>
      <button class="btn small" id="stepsBtn">完整过程</button>
      <span id="conn"></span>
    </div>
    <div id="messages"><div class="inner" id="list"></div></div>
    <div class="composer"><div class="inner">
      <textarea id="input" placeholder="让 Claude 干点活……（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="btns">
        <button class="btn" id="stopBtn" hidden>停止</button>
        <button class="btn primary" id="sendBtn">发送</button>
      </div>
    </div></div>
  </main>
</div>

<div class="overlay" id="stepsBox"><div class="dialog">
  <header><strong>完整过程</strong><span class="meta" id="stepsNote"></span><button class="btn small" id="stepsClose">关闭</button></header>
  <div id="steps"></div>
</div></div>

<div class="overlay" id="login"><form id="loginForm">
  <strong>进入 Claude 工作台</strong>
  <label class="meta">你的名字（会记录在消息和确认操作上）</label>
  <input id="name" autocomplete="nickname" required>
  <label class="meta">访问密码（在台式机中心服务窗口里能看到）</label>
  <input id="pwd" type="password" autocomplete="current-password" required>
  <button class="btn primary">进入</button>
</form></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let token = store.get("token");
let me = store.get("name");
let sessions = [];
let current = null;          // 当前会话 id，null 表示还没发消息的新会话
let messages = [];
let live = null;             // 正在进行的回复 {text, tools}
let approvals = [];          // 当前会话待确认的操作
let es = null;

function api(path, opts = {}) {
  return fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) },
  }).then(async r => {
    if (r.status === 401) { showLogin(); throw new Error("需要密码"); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || r.status);
    return data;
  });
}

function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  return `<div style="white-space:pre-wrap">${esc(text)}</div>`;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function toolChips(tools) {
  if (!tools || !tools.length) return "";
  return '<div class="tools">' + tools.map(t =>
    `<span class="chip" title="${esc(t.detail)}">${esc(t.name)}${t.detail ? " · " + esc(t.detail) : ""}</span>`).join("") + "</div>";
}

function approvalDetail(a) {
  const i = a.input || {};
  if (a.tool === "Bash") return esc(i.command) + (i.description ? `\n\n# ${esc(i.description)}` : "");
  if (a.tool === "Edit") return `<span class="del">- ${esc(i.old_string)}</span>\n<span class="add">+ ${esc(i.new_string)}</span>`;
  if (a.tool === "Write") { const c = i.content || ""; return esc(c.slice(0, 2000)) + (c.length > 2000 ? "\n……" : ""); }
  return esc(JSON.stringify(i, null, 1));
}

function renderSessions() {
  $("sessions").innerHTML = sessions.map(s => `
    <div class="sess ${s.id === current ? "active" : ""}" data-id="${s.id}">
      ${s.running ? '<span class="dot"></span>' : ""}
      <span class="t" title="${esc(s.created_by ? "由 " + s.created_by + " 创建" : "")}">${esc(s.title)}</span>
      ${s.pending ? '<span class="warn">待确认</span>' : ""}
      <button class="x" data-del="${s.id}" title="删除">✕</button>
    </div>`).join("");
}

function renderTop() {
  const s = sessions.find(s => s.id === current);
  $("title").textContent = s ? s.title : "新会话";
  const running = !!(s && s.running);
  $("stopBtn").hidden = !running;
  $("sendBtn").disabled = running;
  $("bypass").checked = !!(s && s.bypass);
  $("bypass").disabled = !s || s.source === "voice";
  $("bypassWrap").classList.toggle("on", !!(s && s.bypass));
  $("stepsBtn").disabled = !s;
}

function renderMessages() {
  renderTop();
  if (!messages.length && !live && !approvals.length) {
    $("list").innerHTML = '<div class="empty">工作目录是 D 盘。可以让 Claude 查找、总结、整理文件。<br>删除、移动文件和运行命令前会在这里请你确认。<br>板子上的语音任务也会出现在左侧（🎤）。</div>';
    return;
  }
  let html = messages.map(m => {
    if (m.role === "user") {
      const who = (m.meta && m.meta.author) || "";
      const tag = m.meta && m.meta.bypass ? " · 完全放行" : "";
      return `<div class="msg user"><div class="body">${esc(m.content)}</div>${who || tag ? `<div class="meta">${esc(who)}${tag}</div>` : ""}</div>`;
    }
    if (m.role === "event") return `<div class="msg event">${esc(m.content)}</div>`;
    const meta = m.meta || {};
    const info = [meta.seconds != null ? meta.seconds + " 秒" : "", meta.cost ? "$" + meta.cost.toFixed(4) : ""].filter(Boolean).join(" · ");
    const body = m.role === "error" ? esc(m.content) : md(m.content);
    return `<div class="msg ${m.role}">${toolChips(meta.tools)}<div class="body">${body}</div>${info ? `<div class="meta">${info}</div>` : ""}</div>`;
  }).join("");
  if (live) {
    html += `<div class="msg assistant">${toolChips(live.tools)}<div class="body ${approvals.length ? "" : "typing"}">${md(live.text)}</div></div>`;
  }
  html += approvals.map(a => `
    <div class="approval">
      <strong>⚠ 需要确认：</strong>${esc(a.summary)}
      <pre>${approvalDetail(a)}</pre>
      <div class="acts">
        <button class="btn" data-deny="${a.id}">拒绝</button>
        <button class="btn primary" data-allow="${a.id}">同意</button>
      </div>
    </div>`).join("");
  const box = $("messages");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  $("list").innerHTML = html;
  if (atBottom || approvals.length) box.scrollTop = box.scrollHeight;
}

async function loadSessions() {
  sessions = await api("/api/sessions");
  renderSessions();
}

async function openSession(id) {
  current = id;
  $("side").classList.remove("open");
  if (!id) { messages = []; live = null; approvals = []; renderSessions(); renderMessages(); $("input").focus(); return; }
  const data = await api("/api/sessions/" + id);
  if (current !== id) return;
  messages = data.messages; live = data.live; approvals = data.approvals;
  renderSessions(); renderMessages();
  $("messages").scrollTop = $("messages").scrollHeight;
}

function upsertSession(s) {
  const i = sessions.findIndex(x => x.id === s.id);
  if (i >= 0) sessions.splice(i, 1);
  sessions.unshift(s);
  sessions.sort((a, b) => b.updated - a.updated);
  renderSessions();
  if (s.id === current) { if (!s.running) live = null; renderMessages(); }
}

function notify(text) {
  if (document.hasFocus()) return;
  if (window.__TAURI__) {  // 桌面软件里走 Tauri 通知插件
    window.__TAURI__.core.invoke("plugin:notification|notify", { options: { title: "Claude 工作台", body: text } }).catch(() => {});
    return;
  }
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification("Claude 工作台", { body: text }); } catch {}
}

function connect() {
  if (es) es.close();
  es = new EventSource("/api/events?token=" + encodeURIComponent(token));
  es.onopen = () => { $("conn").textContent = ""; loadSessions(); if (current) openSession(current); };
  es.onerror = () => { $("conn").textContent = "连接中断，正在重连…"; };
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "session") return upsertSession(ev.session);
    if (ev.type === "session_deleted") {
      sessions = sessions.filter(s => s.id !== ev.session_id); renderSessions();
      if (current === ev.session_id) openSession(null);
      return;
    }
    if (ev.type === "approval") notify("需要确认：" + ev.approval.summary);
    if (ev.session_id !== current && !(ev.approval && ev.approval.session_id === current)) return;
    if (ev.type === "message") {
      if (!messages.some(m => m.id === ev.message.id)) messages.push(ev.message);
      if (ev.message.role === "user") live = { text: "", tools: [] };
      else if (ev.message.role !== "event") live = null;
    } else if (ev.type === "approval") { approvals.push(ev.approval); }
    else if (ev.type === "approval_done") { approvals = approvals.filter(a => a.id !== ev.id); }
    else if (ev.type === "delta_reset") { live = { text: "", tools: live ? live.tools : [] }; }
    else if (ev.type === "delta") { live = live || { text: "", tools: [] }; live.text += ev.text; }
    else if (ev.type === "tool") { live = live || { text: "", tools: [] }; live.tools.push({ name: ev.name, detail: ev.detail }); }
    renderMessages();
  };
}

async function send() {
  const text = $("input").value.trim();
  if (!text || $("sendBtn").disabled) return;
  $("sendBtn").disabled = true;
  if (!window.__TAURI__ && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
  try {
    if (!current) {
      const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ title: text.slice(0, 20), author: me }) });
      current = s.id; messages = []; approvals = []; upsertSession(s);
    }
    await api(`/api/sessions/${current}/messages`, { method: "POST", body: JSON.stringify({ text, author: me }) });
    $("input").value = ""; autosize();
  } catch (e) { alert(e.message); renderTop(); }
}

async function showSteps() {
  if (!current) return;
  $("steps").innerHTML = '<div class="meta">读取中…</div>';
  $("stepsNote").textContent = "";
  $("stepsBox").classList.add("show");
  try {
    const data = await api(`/api/sessions/${current}/transcript`);
    $("stepsNote").textContent = data.note || "";
    const label = { user: "用户", assistant: "Claude", thinking: "思考", tool_use: "调用工具", tool_result: "工具返回" };
    $("steps").innerHTML = data.steps.map(s => `
      <div class="step ${s.kind} ${s.error ? "err" : ""}">
        <div class="k">${label[s.kind] || s.kind}${s.name ? " · " + esc(s.name) : ""}</div>
        <pre>${esc(s.text)}</pre>
      </div>`).join("") || '<div class="meta">没有记录</div>';
    $("steps").scrollTop = $("steps").scrollHeight;
  } catch (e) { $("steps").innerHTML = `<div class="meta">${esc(e.message)}</div>`; }
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; }

function showLogin() { $("name").value = me; $("login").classList.add("show"); (me ? $("pwd") : $("name")).focus(); }

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  token = $("pwd").value.trim();
  me = $("name").value.trim();
  try { await api("/api/sessions"); } catch { $("pwd").select(); return; }
  store.set("token", token); store.set("name", me);
  $("me").textContent = me;
  $("login").classList.remove("show");
  connect();
};
$("switchUser").onclick = e => { e.preventDefault(); showLogin(); };
$("newBtn").onclick = () => openSession(null);
$("menuBtn").onclick = () => $("side").classList.toggle("open");
$("sendBtn").onclick = send;
$("stopBtn").onclick = () => current && api(`/api/sessions/${current}/stop`, { method: "POST" });
$("stepsBtn").onclick = showSteps;
$("stepsClose").onclick = () => $("stepsBox").classList.remove("show");
$("bypass").onchange = async () => {
  const on = $("bypass").checked;
  if (on && !confirm("打开后，本会话里 Claude 的所有操作（包括删除文件、运行命令）都不再询问，直接执行。确定吗？")) {
    $("bypass").checked = false; return;
  }
  try { await api("/api/sessions/" + current, { method: "PATCH", body: JSON.stringify({ bypass: on }) }); }
  catch (e) { alert(e.message); renderTop(); }
};
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("list").onclick = e => {
  const id = e.target.dataset.allow || e.target.dataset.deny;
  if (!id) return;
  e.target.closest(".approval").querySelectorAll("button").forEach(b => b.disabled = true);
  api("/api/approvals/" + id, { method: "POST", body: JSON.stringify({ allow: !!e.target.dataset.allow, author: me }) })
    .catch(err => alert(err.message));
};
$("sessions").onclick = async e => {
  const del = e.target.dataset.del;
  if (del) {
    e.stopPropagation();
    if (confirm("删除这个会话和它的聊天记录？")) api("/api/sessions/" + del, { method: "DELETE" }).catch(err => alert(err.message));
    return;
  }
  const row = e.target.closest(".sess");
  if (row) openSession(row.dataset.id);
};
$("title").ondblclick = async () => {
  if (!current) return;
  const t = prompt("会话名称", $("title").textContent);
  if (t) api("/api/sessions/" + current, { method: "PATCH", body: JSON.stringify({ title: t }) });
};

$("me").textContent = me;
if (token && me) api("/api/sessions").then(() => connect()).catch(() => {});
else showLogin();
renderMessages();
</script>
</body>
</html>
