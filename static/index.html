<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --side: #efeee9; --text: #1f1f1d; --muted: #77756e;
  --border: #e2e0d8; --accent: #c96442; --accent-text: #fff; --user: #ebe8df; --error: #b3261e;
  --chip: #f1efe8; --code: #f3f2ee; --warn-bg: #fdf3e1; --warn: #9a5b00; --ok: #2e7d32; --info-bg: #e8f0fb; --info: #2a5d9f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1d1b; --panel: #262624; --side: #222220; --text: #ecebe6; --muted: #9a988f;
    --border: #3a3936; --accent: #d97757; --user: #34332f; --error: #f2b8b5; --chip: #31302d; --code: #2f2e2b;
    --warn-bg: #3a2f1c; --warn: #f0c27a; --ok: #8bc78e; --info-bg: #1f2c3d; --info: #9cc2f0;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
.app { display: flex; height: 100%; }
[hidden] { display: none !important; }

aside { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.side-head { padding: 14px; display: flex; gap: 8px; align-items: center; }
.side-head h1 { font-size: 16px; margin: 0; flex: 1; }
.side-foot { padding: 10px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.side-foot .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.side-foot a { color: inherit; cursor: pointer; }
.side-foot strong { color: var(--text); }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; white-space: nowrap; text-decoration: none; display: inline-block; line-height: 1.4; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.small { padding: 2px 10px; font-size: 13px; }
.btn.danger { color: var(--error); }
.btn:disabled { opacity: .5; cursor: default; }
a.btn { color: inherit; }
a.btn.primary { color: var(--accent-text); }
#sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sess { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.sess:hover { background: var(--border); }
.sess.active { background: var(--panel); box-shadow: 0 0 0 1px var(--border); }
.sess .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; flex-shrink: 0; display: inline-block; }
.warn { font-size: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 5px; }
.sess .x { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 0 4px; }
.sess:hover .x { visibility: visible; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top .title { flex: 1; min-width: 120px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
.toggle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.toggle.on { color: var(--error); font-weight: 600; }
.wd { font-size: 13px; color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px dashed var(--border); border-radius: 6px; padding: 1px 8px; background: none; }
.wd:disabled { cursor: default; border-style: solid; }
#menuBtn { display: none; }
#conn { font-size: 12px; color: var(--muted); }
.banner { background: var(--info-bg); color: var(--info); font-size: 13px; padding: 6px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.links { background: var(--chip); color: var(--text); }
#messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
.inner { max-width: 820px; margin: 0 auto; }
.msg { margin: 0 0 18px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .body { background: var(--user); padding: 8px 14px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; }
.msg.error .body { color: var(--error); white-space: pre-wrap; }
.msg.event { text-align: center; font-size: 13px; color: var(--muted); }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
.msg table { border-collapse: collapse; } .msg td, .msg th { border: 1px solid var(--border); padding: 4px 8px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tools, .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.msg.user .chips { justify-content: flex-end; margin: 0 0 4px; max-width: 80%; }
.chip { font-size: 12px; background: var(--chip); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.ref { cursor: pointer; }
.chip.skill { border-color: var(--accent); color: var(--accent); }
.chip button { border: 0; background: none; padding: 0 0 0 4px; color: var(--muted); }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
.typing::after { content: "▍"; animation: pulse .6s infinite alternate; }

.approval { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; margin: 0 0 18px; }
.approval strong { color: var(--warn); }
.approval pre { background: var(--panel); border-radius: 6px; padding: 8px; max-height: 260px; overflow: auto; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
.approval .acts { display: flex; gap: 8px; justify-content: flex-end; }
.del { color: var(--error); } .add { color: var(--ok); }

.composer { border-top: 1px solid var(--border); padding: 10px 16px 12px; }
.composer .inner { display: flex; flex-direction: column; gap: 6px; }
#composerChips:empty { display: none; }
#composerChips { margin: 0; }
.composer .row { display: flex; gap: 8px; align-items: flex-end; }
.composer .tools-row { display: flex; gap: 6px; flex-wrap: wrap; }
textarea { flex: 1; resize: none; min-height: 52px; max-height: 240px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.composer .btns { display: flex; flex-direction: column; gap: 6px; }
.dropzone { position: fixed; inset: 0; background: rgba(201,100,66,.15); border: 3px dashed var(--accent); z-index: 30; display: none; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); pointer-events: none; }
.dropzone.show { display: flex; }

.pop { position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.15); width: 340px; max-height: 360px; overflow-y: auto; z-index: 15; padding: 6px; }
.pop .it { padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.pop .it:hover { background: var(--chip); }
.pop .it .d { font-size: 12px; color: var(--muted); }
.anchor { position: relative; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay.show { display: flex; }
.dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 860px; max-height: 90vh; display: flex; flex-direction: column; }
.dialog.narrow { max-width: 440px; }
.dialog header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.dialog header strong { flex: 1; }
.dialog .content { overflow-y: auto; padding: 14px 16px; }
.dialog .foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.form { display: flex; flex-direction: column; gap: 8px; }
.form input, .form select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
.err { color: var(--error); font-size: 13px; min-height: 1.2em; }
#steps { overflow-y: auto; padding: 12px 16px; font-size: 13px; }
.step { margin-bottom: 10px; }
.step .k { font-size: 12px; color: var(--muted); }
.step pre { background: var(--code); border-radius: 6px; padding: 8px; margin: 2px 0 0; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
.step.thinking pre { font-style: italic; color: var(--muted); }
.step.err pre { color: var(--error); }

#login { background: var(--bg); }
#login form { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 12px; width: 100%; max-width: 340px; }

/* 文件 */
#filesBox .dialog { max-width: 1280px; height: 90vh; }
.fhead { flex-wrap: wrap; }
.areas { display: flex; gap: 4px; }
.areas button { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 1px 10px; font-size: 13px; }
.areas button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.crumbs { flex: 1; min-width: 160px; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs a:hover { text-decoration: underline; }
#fq { width: 200px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; }
.pickbar { background: var(--info-bg); color: var(--info); padding: 6px 16px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.pickbar span { flex: 1; }
.fbody { flex: 1; display: flex; min-height: 0; }
#flist { width: 340px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); padding: 6px; }
.fi { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.fi:hover { background: var(--chip); }
.fi.sel { background: var(--user); }
.fi .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi .s { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fi .sub { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
#fview { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fvhead { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fvhead .n { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 100px; }
#fcontent { flex: 1; overflow: auto; position: relative; }
#fcontent .center { color: var(--muted); text-align: center; margin-top: 20%; padding: 0 20px; }
#fcontent .center .btn { margin: 14px 4px 0; }
#fcontent img { max-width: 100%; display: block; margin: 12px auto; }
#fcontent iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
#fcontent video, #fcontent audio { display: block; max-width: 100%; margin: 16px auto; }
#fcontent pre { margin: 0; padding: 12px 16px; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
#fcontent .mdv { padding: 16px 24px; max-width: 860px; }
#fcontent .sheet table { border-collapse: collapse; font-size: 13px; margin: 8px; }
#fcontent .sheet td, #fcontent .sheet th { border: 1px solid var(--border); padding: 2px 6px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.tabs button { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 1px 10px; font-size: 13px; }
.tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#fcontent .docx-wrapper { background: var(--chip); padding: 16px; }
a.fpath { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
#fback { display: none; }

/* 管理 */
#adminBox .dialog { max-width: 1100px; height: 90vh; }
#adminBox .content { flex: 1; }
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; }
table.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; }
table.grid td, table.grid th { border-bottom: 1px solid var(--border); padding: 6px 8px; vertical-align: middle; }
details.grp { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
details.grp summary { padding: 8px 12px; cursor: pointer; font-weight: 600; }
details.grp .sess { margin: 0 6px 4px; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.card h4 { margin: 0 0 2px; font-size: 15px; }
.users-pick { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-top: 6px; }
.filev { display: flex; gap: 10px; min-height: 300px; }
.filev .list { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); font-size: 13px; }
.filev .list div { padding: 3px 6px; cursor: pointer; border-radius: 4px; word-break: break-all; }
.filev .list div.on { background: var(--user); }
.filev pre { flex: 1; margin: 0; background: var(--code); border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 55vh; overflow: auto; }
.status { font-size: 12px; border-radius: 4px; padding: 0 6px; }
.status.pending { background: var(--warn-bg); color: var(--warn); }
.status.approved { background: var(--chip); color: var(--ok); }
.status.rejected { background: var(--chip); color: var(--error); }

@media (max-width: 720px) {
  aside { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; }
  aside.open { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  #menuBtn { display: inline-block; }
  #flist { width: 100%; border-right: 0; }
  #fview { display: none; }
  .fbody.viewing #flist { display: none; }
  .fbody.viewing #fview { display: flex; }
  #fback { display: inline-block; }
  #fq { width: 100%; order: 9; }
  .pop { width: calc(100vw - 32px); }
  .filev { flex-direction: column; }
  .filev .list { width: 100%; border-right: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="side-head"><h1>Claude 工作台</h1><button class="btn primary" id="newBtn">新会话</button></div>
    <div id="sessions"></div>
    <div class="side-foot">
      <div class="row"><strong id="me"></strong><span id="roleTag"></span></div>
      <div class="row">
        <a id="skillsLink">🧩 技能</a>
        <a id="adminLink" hidden>⚙ 管理</a>
        <a id="pwdLink">改密码</a>
        <a id="logoutLink">退出</a>
      </div>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn" id="menuBtn">☰</button>
      <div class="title" id="title" title="双击重命名">新会话</div>
      <button class="wd" id="wdBtn" title="工作文件夹：Claude 在这个文件夹里干活。只能在会话开始前选"></button>
      <label class="toggle" id="bypassWrap" title="打开后本会话的所有操作（包括删除、运行命令）都不再询问">
        <input type="checkbox" id="bypass"> 完全放行
      </label>
      <button class="btn small" id="filesBtn" title="浏览、预览台式机上的文件">📁 文件</button>
      <button class="btn small" id="stepsBtn">完整过程</button>
      <span id="conn"></span>
    </div>
    <div class="banner" id="otherBanner" hidden></div>
    <div class="banner links" id="linksBar" hidden></div>
    <div id="messages"><div class="inner" id="list"></div></div>
    <div class="composer" id="composer"><div class="inner">
      <div class="chips" id="composerChips"></div>
      <div class="tools-row">
        <button class="btn small" id="refBtn" title="从台式机文件库里选文件或文件夹（也可以在输入框里打 @）">📎 引用文件</button>
        <span class="anchor"><button class="btn small" id="skillBtn">🧩 技能</button><div class="pop" id="skillPop" hidden></div></span>
        <button class="btn small" id="localBtn" title="把这台电脑上的文件交给 Claude 处理，处理完可以同步回来">💻 本机文件</button>
        <input type="file" id="uploadInput" multiple hidden>
        <input type="file" id="uploadDirInput" webkitdirectory hidden>
      </div>
      <div class="row">
        <textarea id="input" placeholder="让 Claude 干点活……（Enter 发送，Shift+Enter 换行，@ 引用文件，可以把文件拖进来）"></textarea>
        <div class="btns">
          <button class="btn" id="stopBtn" hidden>停止</button>
          <button class="btn primary" id="sendBtn">发送</button>
        </div>
      </div>
    </div></div>
  </main>
</div>
<div class="dropzone" id="dropzone">松开鼠标，把文件交给 Claude</div>

<div class="overlay" id="stepsBox"><div class="dialog">
  <header><strong>完整过程</strong><span class="meta" id="stepsNote"></span><button class="btn small" data-close>关闭</button></header>
  <div id="steps"></div>
</div></div>

<div class="overlay" id="filesBox"><div class="dialog">
  <header class="fhead">
    <span class="areas" id="areas"><button data-area="">文件库</button><button data-area="ws:">我的工作区</button></span>
    <span class="crumbs" id="crumbs"></span>
    <input id="fq" placeholder="搜索文件名（当前文件夹及子文件夹）">
    <button class="btn small" id="frefDir" title="把当前文件夹引用到对话里">引用此文件夹</button>
    <button class="btn small" data-close>关闭</button>
  </header>
  <div class="pickbar" id="pickbar" hidden><span id="pickText"></span><button class="btn small primary" id="pickOk">选这个文件夹</button></div>
  <div class="fbody" id="fbody">
    <div id="flist"></div>
    <div id="fview">
      <div class="fvhead">
        <button class="btn small" id="fback">←</button>
        <span class="n" id="fname"></span>
        <button class="btn small" id="fref" hidden title="引用到对话里，发送时告诉 Claude">引用到对话</button>
        <button class="btn small" id="flocal" hidden title="下载一份副本，用这台电脑上的软件打开">用本机程序打开</button>
        <a class="btn small" id="fdown" hidden>下载</a>
      </div>
      <div id="fcontent"><div class="center">选择左边的文件预览</div></div>
    </div>
  </div>
</div></div>

<div class="overlay" id="adminBox"><div class="dialog">
  <header><strong>管理</strong>
    <span class="tabs" id="adminTabs" style="position:static;border:0;padding:0">
      <button data-tab="users" class="on">用户</button><button data-tab="chats">聊天记录</button>
      <button data-tab="library">技能库</button><button data-tab="review">待审核 <span id="pendingCount"></span></button>
    </span>
    <span style="flex:1"></span><button class="btn small" data-close>关闭</button>
  </header>
  <div class="content" id="adminContent"></div>
</div></div>

<div class="overlay" id="dlgBox"><div class="dialog narrow" id="dlg">
  <header><strong id="dlgTitle"></strong><button class="btn small" data-close>关闭</button></header>
  <div class="content" id="dlgBody"></div>
  <div class="foot" id="dlgFoot"></div>
</div></div>

<div class="overlay" id="login"><form id="loginForm" class="form">
  <strong id="loginTitle">登录 Claude 工作台</strong>
  <div id="setupHint" class="meta" hidden>第一次使用：创建管理员账号。之后在“⚙ 管理”里给同事建账号。</div>
  <input id="lgUser" placeholder="用户名" autocomplete="username" required>
  <input id="lgName" placeholder="显示的名字（可选）" hidden>
  <input id="lgPwd" type="password" placeholder="密码" autocomplete="current-password" required>
  <input id="lgPwd2" type="password" placeholder="再输一次密码" hidden>
  <div class="err" id="lgErr"></div>
  <button class="btn primary" id="lgBtn">登录</button>
  <div class="meta" id="lgNote">没有账号请找管理员开通</div>
</form></div>

<script src="/static/app.js?v=0.3.0"></script>
<script src="/static/admin.js?v=0.3.0"></script>
</body>
</html>
